<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1140" viewBox="0 0 2100 1140" role="img" aria-labelledby="title description">
  <title id="title">Actuator angle control - connection diagram</title>
  <desc id="description">Assumed board: classic Arduino Uno/Nano (5 V logic). Servo signal on D9; AS5600 remains on 3.3 V and I2C.</desc>
  <rect width="2100" height="1140" fill="#f2f6f7" />
  <text x="40" y="45" font-size="26" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Actuator angle control - connection diagram</text>
  <text x="40" y="78" font-size="15" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Assumed board: classic Arduino Uno/Nano (5 V logic). Servo signal on D9; AS5600 remains on 3.3 V and I2C.</text>
  <rect x="430" y="150" width="330" height="600" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="450" y="182" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Arduino Uno / Nano</text>
  <text x="450" y="210" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">USB power + serial: 115200 baud</text>
  <rect x="1040" y="150" width="360" height="240" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="1060" y="182" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">AS5600 breakout</text>
  <text x="1060" y="210" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">3.3 V supply / I2C address 0x36</text>
  <rect x="1040" y="410" width="420" height="340" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="1060" y="442" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Positional servo</text>
  <text x="1060" y="470" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">500-2352 us / permitted 0-250 degrees</text>
  <rect x="40" y="330" width="290" height="170" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="60" y="362" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">RUN button (NO)</text>
  <text x="60" y="390" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Hold to move / release to hold</text>
  <rect x="40" y="530" width="290" height="170" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="60" y="562" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Direction button (NO)</text>
  <text x="60" y="590" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">At run start: released + / pressed -</text>
  <rect x="1040" y="850" width="420" height="145" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="1060" y="955" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">External servo power supply</text>
  <text x="1060" y="983" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Servo-rated voltage + stall current</text>
  <polyline points="760,250 1040,250" fill="none" stroke="#c52e3e" stroke-width="3" stroke-linejoin="round" />
  <text x="900" y="240" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">3.3 V</text>
  <polyline points="760,285 1040,285" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="900" y="275" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <polyline points="760,320 1040,320" fill="none" stroke="#087c96" stroke-width="3" stroke-linejoin="round" />
  <text x="900" y="310" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">SDA</text>
  <polyline points="760,355 1040,355" fill="none" stroke="#a97900" stroke-width="3" stroke-linejoin="round" />
  <text x="900" y="345" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">SCL</text>
  <polyline points="760,510 1040,510" fill="none" stroke="#e87516" stroke-width="3" stroke-linejoin="round" />
  <text x="900" y="500" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">500-2352 us</text>
  <polyline points="760,630 850,630 850,930 1040,930" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="945" y="920" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">Common ground</text>
  <polyline points="330,420 430,420" fill="none" stroke="#e87516" stroke-width="3" stroke-linejoin="round" />
  <text x="380" y="410" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D6</text>
  <polyline points="330,465 430,465" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="380" y="455" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <polyline points="330,620 430,620" fill="none" stroke="#087c96" stroke-width="3" stroke-linejoin="round" />
  <text x="380" y="610" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D7</text>
  <polyline points="330,665 430,665" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="380" y="655" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <polyline points="1140,850 1140,750" fill="none" stroke="#c52e3e" stroke-width="3" stroke-linejoin="round" />
  <text x="1120" y="805" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">+V servo</text>
  <polyline points="1340,850 1340,750" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="1360" y="805" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Return</text>
  <circle cx="760" cy="250" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="255" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">3.3V</text>
  <circle cx="760" cy="285" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="290" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="760" cy="320" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="325" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">A4 / SDA</text>
  <circle cx="760" cy="355" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="360" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">A5 / SCL</text>
  <circle cx="760" cy="510" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="515" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">D9 / Servo signal</text>
  <circle cx="760" cy="630" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="746" y="635" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="430" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="444" y="425" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">D6 / INPUT_PULLUP</text>
  <circle cx="430" cy="465" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="444" y="470" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="430" cy="620" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="444" y="625" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">D7 / INPUT_PULLUP</text>
  <circle cx="430" cy="665" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="444" y="670" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="1040" cy="250" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="255" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">VCC</text>
  <circle cx="1040" cy="285" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="290" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="1040" cy="320" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="325" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">SDA</text>
  <circle cx="1040" cy="355" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="360" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">SCL</text>
  <circle cx="1040" cy="510" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="515" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Signal</text>
  <circle cx="1140" cy="750" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1140" y="732" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">V+</text>
  <circle cx="1340" cy="750" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1340" y="732" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="330" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="316" y="425" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">Contact 1</text>
  <circle cx="330" cy="465" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="316" y="470" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">Contact 2</text>
  <circle cx="330" cy="620" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="316" y="625" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">Contact 1</text>
  <circle cx="330" cy="665" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="316" y="670" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">Contact 2</text>
  <circle cx="1140" cy="850" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1140" y="877" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">+ (fused)</text>
  <circle cx="1340" cy="850" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1340" y="877" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">-</text>
  <circle cx="1040" cy="930" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1054" y="935" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">- / common GND</text>
  <text x="40" y="1074" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Automatic mode: load EEPROM or calibrate near center; wait for BUTTONS ARMED. D6 runs, D7 selects direction; Z/z centers. Commands limited to 0..250 degrees.</text>
  <text x="40" y="1098" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">AS5600 supply: 3.3 V. Keep I2C pull-ups at 3.3 V; check board/Wire pull-ups and use level shifting if needed. Align its magnet with the measured shaft.</text>
  <text x="40" y="1122" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Supply - pins are one net, joined to Arduino GND and servo GND. Buttons use internal pull-ups. Do not power the servo from Arduino; disconnect power before rewiring.</text>
</svg>