<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">RobStride 00 single-motor bench connections</title>
  <desc id="desc">Signal-level wiring, not connector pin order. Computer USB connects to the RobStride CH340 USB CAN debugger, SKU 100012096. CAN H and CAN L connect to matching motor signals. A dashed GND connection requires confirmation of the motor reference terminal. An external fused DC supply powers the motor separately. Do not assume signal ground is power negative.</desc>
  <style>
    text { font-family: sans-serif; fill: #202a33; font-size: 17px; }
    .heading { font-size: 28px; font-weight: bold; }
    .label { font-size: 20px; font-weight: bold; }
    .small { font-size: 15px; }
    .box { fill: #fff; stroke: #53616c; stroke-width: 2; }
    .wire { fill: none; stroke-width: 4; }
  </style>
  <rect width="1100" height="700" fill="#f4f7f8"/>
  <text x="35" y="48" class="heading">RobStride 00 | CAN Detection Test</text>
  <text x="35" y="79">PROPOSED colors, unverified for your harness. Confirm both thin wires are CAN before testing.</text>
  <rect x="35" y="130" width="190" height="140" rx="6" class="box"/>
  <text x="55" y="168" class="label">Computer</text>
  <text x="55" y="200">USB host</text>
  <path d="M225 210 H315" class="wire" stroke="#626e78"/>
  <text x="247" y="195" class="small">USB</text>
  <rect x="315" y="130" width="265" height="205" rx="6" class="box"/>
  <text x="335" y="160" class="label">RobStride USB-C CAN</text>
  <text x="335" y="184" class="small">CH340 | SKU 100012096</text>
  <text x="335" y="206" class="small">USB powered: 5 V</text>
  <text x="490" y="235">CAN H</text>
  <text x="490" y="278">CAN L</text>
  <path d="M580 230 H825" class="wire" stroke="#bf3333"/>
  <path d="M580 273 H825" class="wire" stroke="#303840"/>
  <text x="490" y="320">GND</text>
  <path d="M580 315 H825" class="wire" stroke="#68727a" stroke-dasharray="8 7"/>
  <text x="603" y="340" class="small">Dashed: verify before wiring</text>
  <text x="600" y="217" class="small">Thin RED (proposed H)</text>
  <text x="600" y="261" class="small">Thin BLACK (proposed L)</text>
  <rect x="825" y="130" width="240" height="350" rx="6" class="box"/>
  <text x="847" y="168" class="label">RobStride 00</text>
  <text x="847" y="235">Thin red: verify H</text>
  <text x="847" y="278">Thin black: verify L</text>
  <text x="847" y="320">CAN reference?</text>
  <text x="847" y="345" class="small">Motor pin not confirmed</text>
  <text x="847" y="394">VBAT+ / thick red*</text>
  <text x="847" y="449">GND / thick black*</text>
  <rect x="35" y="340" width="280" height="140" rx="6" class="box"/>
  <text x="55" y="376" class="label">External DC supply</text>
  <text x="55" y="409">48 V rated; 24-60 V range*</text>
  <text x="55" y="445" class="small">Current limit + regen protection</text>
  <path d="M315 390 H385 M665 390 H825" class="wire" stroke="#bf3333"/>
  <rect x="385" y="365" width="280" height="50" rx="4" class="box"/>
  <text x="405" y="396">Fuse + DC disconnect</text>
  <path d="M315 445 H825" class="wire" stroke="#303840"/>
  <text x="35" y="510">Board front, green terminal TOP / USB BOTTOM: [ GND | CANH | CANL ].</text>
  <text x="35" y="538">Switch 1 OFF (normal). Switch 2 ON (120 ohms at this bus end, unless already terminated).</text>
  <text x="35" y="566">Secure unloaded motor. Detect/read status ONLY; do not enable motion during this test.</text>
  <text x="35" y="594">No detection? Disconnect motor power AND USB before swapping ONLY the thin CAN pair.</text>
  <text x="35" y="622">Bus settings or termination can also prevent detection. Never swap motor power polarity.</text>
  <text x="35" y="650">*Verify power polarity. Dashed ground is unresolved; never connect a thin CAN wire to GND.</text>
  <text x="35" y="680" class="small">Sources: RS00 manual 2.2 / 3.1; Seeed B601-RS guide (colors describe its splitter cable, not this harness).</text>
</svg>