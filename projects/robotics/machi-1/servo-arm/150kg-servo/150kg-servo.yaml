software:
  active_servo_profile: RDS51150
  sketch: 150kg-servo.ino
  library: Arduino Servo
  signal_pin: D9
  run_pin: D6
  direction_pin: D7
  current_sketch:
    attach: myServo.attach(servoPin, 500, 2500)
    pulse_range_us: [500, 2500]
    command_api: writeMicroseconds
    initial_pulse_us: 1500
    nominal_limits_degrees: [0, 270]
    target_increment_us: Variable whole-microsecond steps from elapsed time, retaining fractional remainder
    button_pulse_period_ms: 13.5
    update_interval_ms: 20
    nominal_target_speed_degrees_per_second: 10
    smoothness_note: Fractional accumulation gives a steady average target rate; the specified 3 us dead zone may still cause intermittent physical motion
    centering_target_increment_us: 4
    centering_update_interval_ms: 20
    centering_nominal_speed_degrees_per_second: 27
    run_button_debounce_ms: 30
    startup_settle_ms: 1000
    movement_function: rotateServo(direction, elapsedMs), where +1 increases target and -1 decreases it
    direction_selection: D7 HIGH selects increasing target; LOW selects decreasing target, latched on accepted D6 press
    behavior: Hold D6 LOW to move; release immediately stops target updates and holds position; targets clamp at endpoints
    startup_interlock: D6 must be HIGH for at least 30 ms after startup settle before a new press can move the target
  calibration_reference:
    attach: myServo.attach(servoPin, 500, 2500)
    command_api: writeMicroseconds
    nominal_angle_mapping: pulse_us = 500 + angle_degrees * 2000 / 270
    nominal_positions:
      - {angle_degrees: 0, pulse_us: 500}
      - {angle_degrees: 90, pulse_us: 1167}
      - {angle_degrees: 135, pulse_us: 1500}
      - {angle_degrees: 180, pulse_us: 1833}
      - {angle_degrees: 270, pulse_us: 2500}
    calibration: Verify direction and mechanical clearance unloaded before using full pulse range
safety:
  - Startup commands center even before button movement is armed; test unloaded with full travel clear.
  - Release holds the target, not an emergency stop; the servo may continue moving to reach that target under load.
  - Arduino has no external position feedback; nominal pulse-to-angle mapping requires physical calibration.
  - Reset or startup can cause unexpected motion; keep clear of the high-torque mechanism.
  - Removing servo power can drop a supported load; provide suitable mechanical support.
  - Use an accessible hardware safety arrangement appropriate to the mechanism.