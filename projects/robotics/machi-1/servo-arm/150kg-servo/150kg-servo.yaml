schema_version: 1
title: Arduino Uno - HOOYIJ RDS51150 150KG servo
subtitle: Hold D6 to move / D7 selects direction at press / D9 PWM / external 10-12.6 V / 0-270 degrees
canvas: {width: 1380, height: 940}
components:
  uno:
    label: Arduino Uno R3
    detail: USB powered / INPUT_PULLUP
    bounds: [40, 120, 300, 300]
    pins:
      D9: {label: D9 / servo signal, position: [340, 220], side: right}
      GND: {label: GND / logic reference, position: [340, 320], side: right}
      D6: {label: D6 / run, position: [100, 420], side: bottom}
      D7: {label: D7 / direction, position: [280, 420], side: bottom}
  servo:
    label: HOOYIJ RDS51150
    detail: 150KG / 270-degree position servo
    bounds: [1000, 120, 300, 300]
    pins:
      signal: {label: PWM signal, position: [1000, 220], side: left}
      positive: {label: V+, position: [1120, 420], side: bottom}
      ground: {label: GND, position: [1220, 420], side: bottom}
  supply:
    label: Regulated 12 V supply
    detail: Fused / switched / rated wiring
    bounds: [500, 500, 300, 160]
    pins:
      positive: {label: OUT+, position: [800, 550], side: right}
      negative: {label: OUT- / return, position: [800, 600], side: right}
      logic_ground: {label: GND / Uno, position: [500, 580], side: left}
      run_ground: {label: GND / D6, position: [700, 660], side: bottom}
      direction_ground: {label: GND / D7, position: [560, 660], side: bottom}
    internal_nets:
      common_ground: [negative, logic_ground, run_ground, direction_ground]
    terminal_note: Ground pins represent a rated common-negative terminal block, not isolated outputs.
    positive_path: Supply positive -> appropriately rated fuse -> accessible switch -> OUT+
  run_button:
    label: Run button
    detail: Hold to move / NO contact
    bounds: [40, 600, 180, 140]
    header_offset: 52
    pins:
      signal: {label: D6, position: [100, 600], side: top}
      ground: {label: GND, position: [100, 740], side: bottom}
    action: Press connects D6 to GND; release holds last commanded target.
  direction_switch:
    label: Direction switch
    detail: Open + / closed -
    bounds: [240, 600, 180, 140]
    header_offset: 52
    pins:
      signal: {label: D7, position: [280, 600], side: top}
      ground: {label: GND, position: [280, 740], side: bottom}
    action: Set before pressing D6; open increases target, closed to GND decreases it. A momentary button also works.
connections:
  - from: uno.D9
    to: servo.signal
    color: white
    label: WHITE / PWM signal / D9
    label_position: [670, 206]
    route: [[340, 220], [1000, 220]]
  - from: uno.GND
    to: supply.logic_ground
    color: black
    label: Common GND
    label_position: [420, 306]
    route: [[340, 320], [460, 320], [460, 580], [500, 580]]
  - from: supply.positive
    to: servo.positive
    color: red
    label: RED / +12 V servo power
    label_position: [960, 536]
    route: [[800, 550], [1120, 550], [1120, 420]]
  - from: servo.ground
    to: supply.negative
    color: black
    label: BLACK / ground return
    label_position: [960, 586]
    route: [[1220, 420], [1220, 600], [800, 600]]
  - from: uno.D6
    to: run_button.signal
    color: blue
    label: D6
    label_position: [120, 505]
    label_anchor: start
    route: [[100, 420], [100, 600]]
  - from: uno.D7
    to: direction_switch.signal
    color: yellow
    label: D7
    label_position: [300, 505]
    label_anchor: start
    route: [[280, 420], [280, 600]]
  - from: run_button.ground
    to: supply.run_ground
    color: black
    label: Run button ground
    label_position: [380, 806]
    route: [[100, 740], [100, 820], [700, 820], [700, 660]]
  - from: direction_switch.ground
    to: supply.direction_ground
    color: black
    label: Direction ground
    label_position: [410, 766]
    route: [[280, 740], [280, 780], [560, 780], [560, 660]]
notes:
  - External 10-12.6 V only; never use Uno 5V or direct 24 V. White signal, red positive, black ground; verify pinout before power.
  - Obtain stall current to size supply, fuse and wiring. Keep servo power current out of Uno, USB and breadboard.
  - Startup centers at 135 degrees; release D6 after 1 second to arm. Hold to move; release holds target, not an emergency stop.
