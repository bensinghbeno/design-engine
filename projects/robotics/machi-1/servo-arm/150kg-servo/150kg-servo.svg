<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" role="img" aria-labelledby="title description">
  <title id="title">Arduino Uno - HOOYIJ RDS51150 150KG servo</title>
  <desc id="description">Hold D6 to move / D7 selects direction at press / D9 PWM / external 10-12.6 V / 0-270 degrees</desc>
  <rect width="1380" height="940" fill="#f2f6f7" />
  <text x="40" y="45" font-size="26" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Arduino Uno - HOOYIJ RDS51150 150KG servo</text>
  <text x="40" y="78" font-size="15" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Hold D6 to move / D7 selects direction at press / D9 PWM / external 10-12.6 V / 0-270 degrees</text>
  <rect x="40" y="120" width="300" height="300" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="60" y="152" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Arduino Uno R3</text>
  <text x="60" y="180" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">USB powered / INPUT_PULLUP</text>
  <rect x="1000" y="120" width="300" height="300" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="1020" y="152" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">HOOYIJ RDS51150</text>
  <text x="1020" y="180" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">150KG / 270-degree position servo</text>
  <rect x="500" y="500" width="300" height="160" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="520" y="532" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Regulated 12 V supply</text>
  <text x="520" y="560" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Fused / switched / rated wiring</text>
  <rect x="40" y="600" width="180" height="140" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="60" y="652" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Run button</text>
  <text x="60" y="680" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Hold to move / NO contact</text>
  <rect x="240" y="600" width="180" height="140" rx="4" fill="white" stroke="#53656e" stroke-width="2" />
  <text x="260" y="652" font-size="19" text-anchor="start" font-weight="bold" font-family="sans-serif" fill="#18252b">Direction switch</text>
  <text x="260" y="680" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Open + / closed -</text>
  <polyline points="340,220 1000,220" fill="none" stroke="#53656e" stroke-width="7" />
  <polyline points="340,220 1000,220" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <text x="670" y="206" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">WHITE / PWM signal / D9</text>
  <polyline points="340,320 460,320 460,580 500,580" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="420" y="306" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">Common GND</text>
  <polyline points="800,550 1120,550 1120,420" fill="none" stroke="#c52e3e" stroke-width="3" stroke-linejoin="round" />
  <text x="960" y="536" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">RED / +12 V servo power</text>
  <polyline points="1220,420 1220,600 800,600" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="960" y="586" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">BLACK / ground return</text>
  <polyline points="100,420 100,600" fill="none" stroke="#087c96" stroke-width="3" stroke-linejoin="round" />
  <text x="120" y="505" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">D6</text>
  <polyline points="280,420 280,600" fill="none" stroke="#a97900" stroke-width="3" stroke-linejoin="round" />
  <text x="300" y="505" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">D7</text>
  <polyline points="100,740 100,820 700,820 700,660" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="380" y="806" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">Run button ground</text>
  <polyline points="280,740 280,780 560,780 560,660" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  <text x="410" y="766" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">Direction ground</text>
  <circle cx="340" cy="220" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="326" y="225" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">D9 / servo signal</text>
  <circle cx="340" cy="320" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="326" y="325" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">GND / logic reference</text>
  <circle cx="100" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="100" y="402" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D6 / run</text>
  <circle cx="280" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="280" y="402" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D7 / direction</text>
  <circle cx="1000" cy="220" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1014" y="225" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">PWM signal</text>
  <circle cx="1120" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1120" y="402" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">V+</text>
  <circle cx="1220" cy="420" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="1220" y="402" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="800" cy="550" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="786" y="555" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">OUT+</text>
  <circle cx="800" cy="600" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="786" y="605" font-size="14" text-anchor="end" font-weight="normal" font-family="sans-serif" fill="#18252b">OUT- / return</text>
  <circle cx="500" cy="580" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="514" y="585" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">GND / Uno</text>
  <circle cx="700" cy="660" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="700" y="642" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND / D6</text>
  <circle cx="560" cy="660" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="560" y="642" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND / D7</text>
  <circle cx="100" cy="600" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="100" y="627" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D6</text>
  <circle cx="100" cy="740" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="100" y="722" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <circle cx="280" cy="600" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="280" y="627" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">D7</text>
  <circle cx="280" cy="740" r="5" fill="white" stroke="#18252b" stroke-width="2" />
  <text x="280" y="722" font-size="14" text-anchor="middle" font-weight="normal" font-family="sans-serif" fill="#18252b">GND</text>
  <text x="40" y="874" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">External 10-12.6 V only; never use Uno 5V or direct 24 V. White signal, red positive, black ground; verify pinout before power.</text>
  <text x="40" y="898" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Obtain stall current to size supply, fuse and wiring. Keep servo power current out of Uno, USB and breadboard.</text>
  <text x="40" y="922" font-size="14" text-anchor="start" font-weight="normal" font-family="sans-serif" fill="#18252b">Startup centers at 135 degrees; release D6 after 1 second to arm. Hold to move; release holds target, not an emergency stop.</text>
</svg>