<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-label="AS5600 to Arduino Uno">
<defs><marker id="connection-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#25313b" /></marker></defs>
<rect x="0" y="0" width="1600" height="920" fill="#fbfaf7" />
<text x="100" y="80" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="38" font-weight="bold">AS5600 to Arduino Uno</text>
<text x="102" y="120" fill="#66737b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">Direct wiring - no external I2C level shifter</text>
<rect x="100" y="165" width="1400" height="60" rx="8" ry="8" fill="#fff0ec" stroke="#d98573" stroke-width="2" />
<text x="122" y="196" fill="#8e342b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" font-weight="bold">Direct Uno I2C is 5V. Use only with a breakout rated for 5V I2C.</text>
<rect x="100" y="285" width="420" height="430" rx="12" ry="12" fill="#edf4ee" stroke="#c4ccd0" stroke-width="2" />
<rect x="100" y="285" width="420" height="82" rx="12" ry="12" fill="#39785d" />
<rect x="100" y="333" width="420" height="34" fill="#39785d" />
<text x="122" y="329" fill="#ffffff" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="22" font-weight="bold">Arduino Uno</text>
<text x="123" y="358" fill="#e9eef0" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13">I2C pins are free in the supplied sketch</text>
<rect x="1080" y="285" width="420" height="430" rx="12" ry="12" fill="#edf2f8" stroke="#c4ccd0" stroke-width="2" />
<rect x="1080" y="285" width="420" height="82" rx="12" ry="12" fill="#3f759e" />
<rect x="1080" y="333" width="420" height="34" fill="#3f759e" />
<text x="1102" y="329" fill="#ffffff" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="22" font-weight="bold">AS5600 Breakout</text>
<text x="1103" y="358" fill="#e9eef0" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13">Confirm the board's supply and I2C ratings</text>
<polyline points="520,435 800.0,435 800.0,435 1080,435" fill="none" stroke="#d28a25" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#connection-arrow)" />
<polyline points="520,505 800.0,505 800.0,505 1080,505" fill="none" stroke="#46515b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#connection-arrow)" />
<polyline points="520,575 800.0,575 800.0,575 1080,575" fill="none" stroke="#27845f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#connection-arrow)" />
<polyline points="520,645 800.0,645 800.0,645 1080,645" fill="none" stroke="#3479b5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#connection-arrow)" />
<circle cx="520" cy="435" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="502" y="440" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="end" dominant-baseline="middle">3.3V</text>
<circle cx="520" cy="505" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="502" y="510" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="end" dominant-baseline="middle">GND</text>
<circle cx="520" cy="575" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="502" y="580" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="end" dominant-baseline="middle">A4 / SDA</text>
<circle cx="520" cy="645" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="502" y="650" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="end" dominant-baseline="middle">A5 / SCL</text>
<circle cx="1080" cy="435" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="1098" y="440" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="start" dominant-baseline="middle">VCC</text>
<circle cx="1080" cy="505" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="1098" y="510" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="start" dominant-baseline="middle">GND</text>
<circle cx="1080" cy="575" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="1098" y="580" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="start" dominant-baseline="middle">SDA</text>
<circle cx="1080" cy="645" r="6" fill="#ffffff" stroke="#25313b" stroke-width="2" />
<text x="1098" y="650" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="start" dominant-baseline="middle">SCL</text>
<line x1="100" y1="780" x2="138" y2="780" stroke="#d28a25" stroke-width="5" stroke-linecap="round" />
<text x="150" y="774" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" dominant-baseline="middle">3.3V power</text>
<line x1="305.0" y1="780" x2="343.0" y2="780" stroke="#46515b" stroke-width="5" stroke-linecap="round" />
<text x="355.0" y="774" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" dominant-baseline="middle">Ground</text>
<line x1="476.0" y1="780" x2="514.0" y2="780" stroke="#27845f" stroke-width="5" stroke-linecap="round" />
<text x="526.0" y="774" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" dominant-baseline="middle">SDA data</text>
<line x1="664.0" y1="780" x2="702.0" y2="780" stroke="#3479b5" stroke-width="5" stroke-linecap="round" />
<text x="714.0" y="774" fill="#25313b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" dominant-baseline="middle">SCL clock</text>
<text x="100" y="830" fill="#66737b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14">A4 is SDA and A5 is SCL on the Uno R3. These pins do not conflict with D2, D3, D4, D6, or D7.</text>
<text x="100" y="858" fill="#66737b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14">Uno 3.3V -&gt; breakout VCC; Uno GND -&gt; breakout GND. Verify the breakout accepts 3.3V power.</text>
<text x="100" y="886" fill="#66737b" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14">Direct SDA/SCL is safe only if the breakout explicitly supports 5V I2C or has onboard level shifting.</text>
</svg>
