title: Actuator Angle Control - Complete Wiring
subtitle: Arduino Uno R3 | AS5600 I2C feedback | DM542 common-anode control | two jog buttons
warning: Power OFF before wiring. Motor DC supply must NEVER connect to Uno 5V. Verify driver voltage limits and ENA polarity.
