  - {from: dm542.DIR+, to: dm542.ENA+, kind: power, via: [[1140, 450], [1140, 500]]}
  - {from: uno.D3, to: dm542.PUL-, kind: control, via: []}
  - {from: uno.D2, to: dm542.DIR-, kind: control, via: []}
  - {from: uno.D4, to: dm542.ENA-, kind: control, via: []}
